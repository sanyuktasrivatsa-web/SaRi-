<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanyukta & Rishabh | Wedding</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Alegreya', serif;
      background: rgb(253, 248, 240);
    }
    .heading-font {
      font-family: 'Playfair Display', serif;
    }
    .hero {
      position: relative;
      height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.55));
      z-index: 1;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header class="hero">
    <!-- REPLACE THIS IMAGE PATH -->
    <img src="assets/images/hero.jpg" alt="Wedding hero image">

    <div class="hero-content px-4">
      <p class="uppercase tracking-widest mb-2 text-sm opacity-80">
        Together with their families
      </p>
      <h1 class="heading-font text-5xl font-bold">
        Sanyukta & Rishabh
      </h1>
      <p class="mt-4 text-lg opacity-90">
        March 2027
      </p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-16">

    <!-- ACCESS CODE -->
    <section class="max-w-md mx-auto text-center mb-20">
      <h2 class="heading-font text-2xl font-bold mb-4">Welcome</h2>
      <p class="mb-6 text-stone-500">Please enter your invitation code</p>

      <form id="code-form" class="space-y-4">
        <input
          id="access-code-input"
          type="text"
          required
          class="w-full border border-amber-200 rounded-lg px-4 py-3 text-center text-lg bg-white"
        />
        <button
          type="submit"
          class="w-full py-3 rounded-full font-bold text-white"
          style="background: rgb(180,83,9);"
        >
          View Invitation
        </button>
        <p id="code-error" class="text-red-600 hidden">
          Invalid code. Please check your invitation.
        </p>
